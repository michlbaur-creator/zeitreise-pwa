name: Zeitreise veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: App installieren
        working-directory: App
        run: npm ci

      - name: App bauen
        working-directory: App
        env:
          GITHUB_PAGES: "true"
        run: npm run build:pages

      - name: Website verpacken
        uses: actions/upload-pages-artifact@v4
        with:
          path: App/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
